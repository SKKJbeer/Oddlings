# Beschreibung des Xcode-Projekts für XcodeGen (`xcodegen generate`).
# Das .xcodeproj wird erzeugt und ist nicht eingecheckt: Diese Datei ist die
# Wahrheit, neue Swift-Dateien landen nur im Ordner, nie im Projekt.

name: Oddlings
options:
  bundleIdPrefix: de.skkjbeer
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Oddlings:
    type: application
    platform: iOS
    sources:
      - path: App
      # Dieselbe Datei, die das Prüfskript liest: Der Spike zeichnet die echte
      # Karte von Mission 1, nicht eine ausgedachte.
      - path: config/balance/mvp-mission-01.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.skkjbeer.oddlings
        PRODUCT_NAME: Oddlings
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Nur iPhone (D-006). Ein iPad startet die App trotzdem, im Kompatibilitätsmodus.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oddlings
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Querformat (D-004), beide Richtungen, damit Links- und Rechtshänder
        # das Gerät halten können, wie sie wollen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Platzhaltersymbol (der Weg von Mission 1). Ohne Symbol nimmt App Store
        # Connect keinen Bau an.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

schemes:
  Oddlings:
    build:
      targets:
        Oddlings: all
    run:
      config: Debug
    archive:
      config: Release
