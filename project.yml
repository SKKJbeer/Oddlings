# Beschreibung des Xcode-Projekts für XcodeGen (`xcodegen generate`).
# Das .xcodeproj wird erzeugt und ist nicht eingecheckt: Diese Datei ist die
# Wahrheit, neue Swift-Dateien landen nur im Ordner, nie im Projekt.

name: Oddlings
options:
  bundleIdPrefix: de.skkjbeer
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OddlingsCore:
    path: Packages/OddlingsCore

targets:
  Oddlings:
    type: application
    platform: iOS
    dependencies:
      - package: OddlingsCore
    sources:
      - path: App
      # Dieselbe Datei, die die Simulation liest: Der Spike zeichnet die echte
      # Karte von Mission 1, nicht eine ausgedachte.
      - path: Packages/OddlingsCore/Sources/OddlingsCore/Resources/Balance/mvp-mission-01.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.skkjbeer.oddlings
        PRODUCT_NAME: Oddlings
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        # Nur iPhone (D-006). Ein iPad startet die App trotzdem, im Kompatibilitätsmodus.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oddlings
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Querformat (D-004), beide Richtungen, damit Links- und Rechtshänder
        # das Gerät halten können, wie sie wollen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Platzhaltersymbol (der Weg von Mission 1). Ohne Symbol nimmt App Store
        # Connect keinen Bau an.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        # Das Profil gilt nur für die App. Über die Befehlszeile gesetzt, griffe
        # es auch beim Ressourcenbündel des Pakets, und das Archivieren bricht ab
        # („does not support provisioning profiles", Bau 6 bis 11).
        # testflight.yml setzt ODDLINGS_PROFIL; lokal bleibt es leer.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(ODDLINGS_PROFIL)

  OddlingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Oddlings
      - package: OddlingsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.skkjbeer.oddlings.tests
        CODE_SIGN_STYLE: Automatic

  # End-zu-End-Tests (docs/konzepte/e2e-tests.md): die App wie ein Spieler. Sie
  # binden OddlingsCore ein, um Zellen und Zahlen aus der Missionsdatei zu nehmen,
  # statt Koordinaten im Test festzuschreiben.
  OddlingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Oddlings
      - package: OddlingsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.skkjbeer.oddlings.uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Oddlings

schemes:
  Oddlings:
    build:
      targets:
        Oddlings: all
        OddlingsTests: [test]
        OddlingsUITests: [test]
    test:
      targets:
        - OddlingsTests
        - OddlingsUITests
    run:
      config: Debug
    archive:
      config: Release
