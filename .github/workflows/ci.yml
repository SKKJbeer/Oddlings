name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Regeln, die kein Compiler sieht: Importe und Determinismus der Simulation,
  # offline, keine Schlüssel im Repo, Actions fest gebunden. Sekunden, kein Swift.
  regeln:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Architektur- und Sicherheitsregeln
        run: scripts/regeln-pruefen.sh

  # Grafik: Atlas gegen den Asset-Vertrag, Kartenvorlage gegen die Weggeometrie.
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow
        run: python -m pip install --quiet "pillow==11.3.0"
      - name: Grafik-Pipeline testen
        run: python -m unittest discover -s tools/art-check/tests -v
      - name: Atlas prüfen
        run: python tools/art-check/check_assets.py .

  # Die Simulation braucht nur Foundation. Unter Linux geprüft, damit ein
  # versehentlicher Apple-Import sofort rot wird, nicht erst im Mac-Lauf.
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Simulation testen
        run: swift test --package-path Packages/OddlingsCore

  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: iphone-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Umgebung
        run: |
          scripts/xcode-waehlen.sh
          swift --version

      - name: Simulation testen
        run: swift test --package-path Packages/OddlingsCore

      - name: XcodeGen
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      # Ein Simulator mit Namen statt „generic/platform": Der Probelauf unten
      # braucht dasselbe Gerät, auf dem gebaut wurde.
      - name: Simulator wählen
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          for k in ios:
              for dev in d[k]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          sys.exit("kein iPhone-Simulator gefunden")')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project Oddlings.xcodeproj -scheme Oddlings \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 80

      # App-Tests (AppTests) und Oberflächentests (AppUITests). Das Protokoll
      # wird nicht nur gekürzt gezeigt: Jeder Testfall steht mit Ergebnis im
      # Lauf, sonst sieht man nicht, ob ein Ziel überhaupt gelaufen ist.
      - name: App testen
        run: |
          set -o pipefail
          status=0
          xcodebuild test \
            -project Oddlings.xcodeproj -scheme Oddlings \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO > build/app-test.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|: error:|Executed [0-9]+ test" build/app-test.log || true
          tail -n 30 build/app-test.log
          exit $status

      # Übersetzen beweist nicht, dass die App läuft. Starten, laufen lassen,
      # nachsehen, ob der Prozess noch lebt, und ein Bild sichern.
      - name: Probelauf im Simulator
        run: |
          APP=$(find build/DerivedData/Build/Products -name "Oddlings.app" -maxdepth 3 | head -1)
          test -n "$APP" || { echo "::error::Oddlings.app nicht gefunden"; exit 1; }
          # Nach den Tests läuft der Simulator schon.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" de.skkjbeer.oddlings --demo
          sleep 20
          mkdir -p build/probe
          xcrun simctl io "$UDID" screenshot build/probe/mission.png
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q de.skkjbeer.oddlings; then
            echo "::error::Die App läuft nach 20 Sekunden nicht mehr."
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i oddlings || true
            exit 1
          fi
          echo "::notice::App läuft nach 20 Sekunden noch."

      - name: Bild weiterreichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-probe
          path: build/probe/
          if-no-files-found: ignore
          retention-days: 14
