name: TestFlight

# Baut die App, signiert sie und lädt sie zu TestFlight hoch. Danach wartet
# der Lauf, bis Apple den Bau verarbeitet hat (VALID), und stellt ihn der
# internen Gruppe „Team" bereit.
#
# Benötigte Repository-Geheimnisse (Rolle des Schlüssels: Admin):
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_KEY_P8
# Sie lassen sich aus Zählora übertragen, ohne dass jemand sie sieht:
# Repo PulseMeter → Actions → „Apple-Zugänge weitergeben" → Ziel „Oddlings".
#
# Einmalig von Hand: App-Eintrag in App Store Connect mit der Bundle-ID
# de.skkjbeer.oddlings. Apple erlaubt das Anlegen nicht über die Schnittstelle.

on:
  push:
    branches: [main]
    paths: ['App/**', 'Packages/**', 'project.yml', '.github/workflows/testflight.yml', 'scripts/apple.py', 'scripts/xcode-waehlen.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  # Nie abbrechen: Ein abgebrochener Lauf kann Zertifikat und Profil bei
  # Apple liegen lassen und eine Baunummer verbrauchen.
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Jede Hochladung braucht eine neue, steigende Nummer; die Laufnummer
      # zählt auch bei roten Läufen weiter.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      # Als erster Schritt: Sonst scheitert der Lauf nach zwanzig Minuten an
      # einer Meldung, die das fehlende Geheimnis nicht nennt.
      - name: Zugänge prüfen
        run: |
          fehlt=""
          for v in KEY_ID ISSUER KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || fehlt="$fehlt $v"; done
          if [ -n "$fehlt" ]; then
            echo "::error::Apple-Geheimnisse fehlen:$fehlt. Übertragen mit PulseMeter → Actions → „Apple-Zugänge weitergeben“, Ziel Oddlings."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          scripts/xcode-waehlen.sh

      - name: Bundle-ID und App-Eintrag
        run: python3 scripts/apple.py vorbereiten

      - name: Signatur anlegen
        run: |
          set -euo pipefail
          SIG="$RUNNER_TEMP/sig"
          python3 scripts/apple.py signatur-anlegen "$SIG"
          PW=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["passwort"])' "$SIG/ids.json")
          echo "::add-mask::$PW"
          KC="$RUNNER_TEMP/ci.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$SIG/signatur.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          # Ohne diese Zeile wartet codesign auf ein Kennwort, bis die Zeitgrenze greift.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          UUID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["profilUuid"])' "$SIG/ids.json")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIG/profil.mobileprovision" "$d/$UUID.mobileprovision"
          done

      - name: Archivieren und hochladen
        run: |
          set -euo pipefail
          SIG="$RUNNER_TEMP/sig"
          PROFIL=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["profilName"])' "$SIG/ids.json")
          KEY="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" > "$KEY"
          xcodegen generate
          xcodebuild archive -project Oddlings.xcodeproj -scheme Oddlings -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Oddlings.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL" 2>&1 | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>de.skkjbeer.oddlings</key><string>${PROFIL}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Oddlings.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" 2>&1 | tail -40
          rm -f "$KEY"

      - name: Signatur bei Apple wieder entfernen
        if: always()
        run: |
          python3 scripts/apple.py signatur-aufraeumen "$RUNNER_TEMP/sig" || true
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true

      # Hochgeladen heißt nicht verfügbar. Erst VALID ist ein Bau, den man
      # installieren kann.
      - name: Auf Apple warten und bereitstellen
        run: |
          python3 scripts/apple.py testflight
          echo "## TestFlight: Bau $BUILD_NUMBER ist VALID und in der Gruppe „Team“" >> "$GITHUB_STEP_SUMMARY"
